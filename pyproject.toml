[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrabble-harness"
dynamic = ["version"]
description = "An adaptive, observable harness for assisted LLM Scrabble play."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.100,<7",
    "pytest>=8.3,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "scrabble_harness.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["scrabble_harness*"]

[tool.setuptools.package-data]
scrabble_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "native: requires a built native engine and configured fixture data",
]

